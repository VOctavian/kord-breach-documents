name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # На сайт кладём только просмотр: редактор и локальный сервер остаются в репозитории,
      # но не публикуются — редактировать точки можно лишь локально.
      - name: Собрать read-only версию
        run: |
          mkdir -p _site
          # editor.html теперь публикуется: админ правит точки с любого устройства,
          # а сохранение уходит в репозиторий через Edge Function. Без роли admin
          # функция отвечает 403, так что сама страница ничего не открывает.
          # Страницы локаций генерируются в корень (shoreline.html и остальные),
          # поэтому берём все html разом — кроме редактора опросов, он локальный.
          for f in *.html; do [ "$f" = "survey-editor.html" ] || cp "$f" _site/; done
          cp sitemap.xml robots.txt _site/
          cp -r css js data assets documentations _site/
          # Редактор опросов остаётся локальным: он пишет файлы через server.mjs.
          rm -f _site/js/survey-editor.js
          touch _site/.nojekyll
          test ! -e _site/server.mjs
          test ! -e _site/survey-editor.html && test ! -e _site/js/survey-editor.js
          test ! -e _site/.env.local
          # Ключ в обход RLS не должен уехать в браузер ни при каких правках.
          ! grep -rIq "service_role\|SUPABASE_SERVICE_KEY" _site
          # Админка без своего HTML даёт молчаливую 404 — это обиднее падения сборки.
          test -e _site/admin.html && test -e _site/js/admin.js && test -e _site/js/auth.js
          test -e _site/editor.html && test -e _site/js/editor.js && test -e _site/js/store.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Разворачивание иногда зависает в очереди на стороне GitHub Pages,
  # поэтому даём деплою запас по времени вместо десятиминутного дефолта.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
