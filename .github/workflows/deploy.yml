name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # На сайт кладём только просмотр: редактор и локальный сервер остаются в репозитории,
      # но не публикуются — редактировать точки можно лишь локально.
      - name: Собрать read-only версию
        run: |
          mkdir -p _site/js
          cp index.html map.html _site/
          cp -r css data assets documentations _site/
          cp js/common.js js/i18n.js js/widgets.js js/analytics.js js/index.js js/map.js _site/js/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Разворачивание иногда зависает в очереди на стороне GitHub Pages,
  # поэтому даём деплою запас по времени вместо десятиминутного дефолта.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
