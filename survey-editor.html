<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Редактор опросов — Kord Breach</title>
  <link rel="icon" href="assets/favicon/favicon.ico" sizes="any">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="btn" href="index.html">← На сайт</a>
    <h1>Опросы</h1>
    <span class="sub" id="active-note"></span>
    <span class="spacer"></span>
    <span class="status" id="status"></span>
    <button class="btn primary" id="done" title="Дописать правки и открыть сайт">Готово</button>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="group">
        <h3>Опросы</h3>
        <div class="sv-list" id="sv-list"></div>
        <button class="btn" id="sv-new" type="button">+ Новый опрос</button>
      </div>
    </aside>

    <main class="sv-main">
      <div class="sv-tabs">
        <button class="sv-tab active" id="tab-edit" type="button">Опрос</button>
        <button class="sv-tab" id="tab-results" type="button">Ответы</button>
      </div>

      <section id="pane-edit"></section>

      <section id="pane-results" hidden>
        <div class="sv-results-bar">
          <span id="sv-count" class="sub"></span>
          <span class="spacer"></span>
          <button class="btn" id="sv-reload" type="button">Обновить</button>
          <button class="btn" id="sv-csv" type="button">Выгрузить CSV</button>
        </div>
        <div id="sv-results"></div>
      </section>
    </main>
  </div>

  <script type="module" src="js/survey-editor.js"></script>
</body>
</html>
